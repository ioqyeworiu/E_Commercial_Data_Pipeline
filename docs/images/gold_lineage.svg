<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 720" width="1260" height="720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1260" height="720" rx="12" fill="#ffffff"/>
  <text x="630" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Luồng dữ liệu vào lớp gold (số trên ô = thứ tự loader trong src/python/ETL/d_gold/)</text>

  <!-- column headers -->
  <g font-size="13" font-weight="700" fill="#475569" text-anchor="middle">
    <text x="120" y="62">BRONZE</text>
    <text x="365" y="62">SILVER</text>
    <text x="635" y="62">GOLD · dimension + F1</text>
    <text x="925" y="62">GOLD · fact dẫn xuất</text>
    <text x="1165" y="62">VIEW</text>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <!-- bronze_product_snapshot -> silver -->
    <line x1="220" y1="235" x2="268" y2="115"/>
    <line x1="220" y1="235" x2="268" y2="185"/>
    <line x1="220" y1="235" x2="268" y2="255"/>
    <line x1="220" y1="235" x2="268" y2="325"/>
    <line x1="220" y1="235" x2="268" y2="395"/>
    <!-- silver -> gold dims -->
    <line x1="460" y1="115" x2="518" y2="145"/>
    <line x1="460" y1="182" x2="518" y2="205"/>
    <line x1="460" y1="252" x2="518" y2="265"/>
    <line x1="460" y1="322" x2="518" y2="322"/>
    <line x1="460" y1="390" x2="518" y2="332"/>
    <!-- silver -> F1 -->
    <line x1="460" y1="190" x2="518" y2="428"/>
    <line x1="460" y1="260" x2="518" y2="435"/>
    <line x1="460" y1="400" x2="518" y2="442"/>
    <!-- F1 -> derived facts -->
    <line x1="750" y1="435" x2="808" y2="365"/>
    <line x1="750" y1="435" x2="808" y2="435"/>
    <line x1="750" y1="435" x2="808" y2="505"/>
    <line x1="750" y1="440" x2="808" y2="588"/>
    <!-- F2 -> views, F2 -> F5 -->
    <line x1="1040" y1="360" x2="1088" y2="335"/>
    <line x1="1040" y1="365" x2="1088" y2="405"/>
    <polyline points="1040,372 1064,372 1064,505 1042,505"/>
    <!-- bronze_user_review -> dim_reviewer, fact_review -->
    <line x1="220" y1="652" x2="518" y2="652"/>
    <polyline points="220,638 495,638 495,560 790,560 808,580"/>
  </g>

  <!-- arrow labels -->
  <g font-size="10.5" fill="#64748b" font-style="italic">
    <text x="474" y="478">brand_sk → brand_normalized</text>
    <text x="474" y="492">seller_sk → tên + rating</text>
    <text x="1068" y="455" transform="rotate(90 1068 455)">units, revenue</text>
    <text x="772" y="522" text-anchor="end">khóa sản phẩm mới nhất</text>
    <text x="505" y="553">review_key = hash(url_id, user, biến thể, comment)</text>
    <text x="300" y="646">gom theo user_name</text>
  </g>

  <!-- ===================== BOXES ===================== -->
  <g font-size="12" fill="#1f2937">
    <!-- bronze -->
    <rect x="20" y="180" width="200" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="120" y="210" text-anchor="middle" font-weight="700">bronze_product_snapshot</text>
    <text x="120" y="232" text-anchor="middle">Spark b_bronze (chuẩn hóa)</text>
    <text x="120" y="252" text-anchor="middle">1 dòng / sản phẩm / lần crawl</text>
    <text x="120" y="272" text-anchor="middle">đã lọc trùng idempotency_key</text>

    <rect x="20" y="615" width="200" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="120" y="640" text-anchor="middle" font-weight="700">bronze_user_review</text>
    <text x="120" y="660" text-anchor="middle">1 dòng / review / lần crawl</text>

    <!-- silver -->
    <rect x="270" y="90" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="365" y="112" text-anchor="middle" font-weight="700">silver_category</text>
    <text x="365" y="130" text-anchor="middle" font-size="11">1 dòng / category_tree</text>

    <rect x="270" y="160" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="365" y="182" text-anchor="middle" font-weight="700">silver_brand</text>
    <text x="365" y="200" text-anchor="middle" font-size="11">khóa = brand + origin</text>

    <rect x="270" y="230" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="365" y="252" text-anchor="middle" font-weight="700">silver_seller</text>
    <text x="365" y="270" text-anchor="middle" font-size="11">khóa = tên + rating</text>

    <rect x="270" y="300" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="365" y="322" text-anchor="middle" font-weight="700">silver_product</text>
    <text x="365" y="340" text-anchor="middle" font-size="11">1 dòng / version sản phẩm</text>

    <rect x="270" y="370" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="365" y="392" text-anchor="middle" font-weight="700">silver_snapshot</text>
    <text x="365" y="410" text-anchor="middle" font-size="11">1 dòng / lần crawl + các sk</text>

    <!-- gold dims + F1 -->
    <rect x="520" y="70" width="230" height="44" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="635" y="90" text-anchor="middle" font-weight="700">01 · gold_dim_date</text>
    <text x="635" y="106" text-anchor="middle" font-size="11">sinh tự động 2015 – 2030</text>

    <rect x="520" y="122" width="230" height="44" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="635" y="149" text-anchor="middle" font-weight="700">02 · gold_dim_category</text>

    <rect x="520" y="182" width="230" height="44" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="635" y="209" text-anchor="middle" font-weight="700">03 · gold_dim_brand</text>

    <rect x="520" y="242" width="230" height="44" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="635" y="269" text-anchor="middle" font-weight="700">04 · gold_dim_seller</text>

    <rect x="520" y="302" width="230" height="44" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="635" y="322" text-anchor="middle" font-weight="700">05 · gold_dim_product</text>
    <text x="635" y="338" text-anchor="middle" font-size="11">SCD2: version_no, valid_from/to</text>

    <rect x="520" y="410" width="230" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="635" y="432" text-anchor="middle" font-weight="700">07 · gold_fact_product_snapshot</text>
    <text x="635" y="450" text-anchor="middle" font-size="11">đổi khóa silver → khóa gold</text>

    <rect x="520" y="630" width="230" height="44" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="635" y="657" text-anchor="middle" font-weight="700">06 · gold_dim_reviewer</text>

    <!-- derived facts -->
    <rect x="810" y="340" width="230" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="925" y="362" text-anchor="middle" font-weight="700">08 · gold_fact_product_daily</text>
    <text x="925" y="380" text-anchor="middle" font-size="11">gom theo ngày + chênh lệch lũy kế</text>

    <rect x="810" y="410" width="230" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="925" y="432" text-anchor="middle" font-weight="700">09 · gold_fact_price_change</text>
    <text x="925" y="450" text-anchor="middle" font-size="11">so với lần crawl trước (lag)</text>

    <rect x="810" y="480" width="230" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="925" y="502" text-anchor="middle" font-weight="700">11 · gold_fact_seller_daily</text>
    <text x="925" y="520" text-anchor="middle" font-size="11">từ F1 (rating) + F2 (bán)</text>

    <rect x="810" y="565" width="230" height="50" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
    <text x="925" y="587" text-anchor="middle" font-weight="700">10 · gold_fact_review</text>
    <text x="925" y="605" text-anchor="middle" font-size="11">bronze review + khóa từ F1</text>

    <!-- views -->
    <rect x="1090" y="310" width="150" height="50" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="1165" y="331" text-anchor="middle" font-weight="700" font-size="11">gold_agg_category_daily</text>
    <text x="1165" y="348" text-anchor="middle" font-size="10.5">F2 ⋈ dim_category</text>

    <rect x="1090" y="380" width="150" height="50" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="1165" y="401" text-anchor="middle" font-weight="700" font-size="11">gold_agg_brand_daily</text>
    <text x="1165" y="418" text-anchor="middle" font-size="10.5">F2 ⋈ dim_brand</text>
  </g>
</svg>
