services:
  postgres_crawler_storage:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pg_crawler_db
    hostname: pg-crawler-db
    ports:
      - "5432:5432"
    cpus: 1
    mem_limit: 1g
    volumes:
      - ./docker_mount/postgresql:/var/lib/postgresql
    environment:
      POSTGRES_USERNAME_FILE: /run/secrets/postgresql_admin_username
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql_admin_password
    secrets:
      - postgresql_admin_username
      - postgresql_admin_password
    networks:
      - postgresql-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 300s
  
  kafka_1:
    image: apache/kafka:4.4.0-rc4
    container_name: kafka_1
    hostname: kafka-1
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "9092:9092"
    cpus: 1
    mem_limit: 1g
    environment:
      # KRaft identity and roles
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ylDN-uoLRqKZtQnKtIwKPw
      # Three listeners:
      # HOST: host machine
      # INTERNAL: other Docker containers
      # CONTROLLER: KRaft metadata quorum
      KAFKA_LISTENERS: >-
        HOST://0.0.0.0:9092,
        INTERNAL://0.0.0.0:9093,
        CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: >-
        HOST://localhost:9092,
        INTERNAL://kafka-1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        HOST:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094
      # Single-broker replication settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Topic defaults
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      # Message size limits
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      # Group coordination
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # JVM
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx1G"
      # Log storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./docker_mount/kafka_1/data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - kafka-net

  spark_master:
    image: spark:4.2.0-scala2.13-java21-python3-ubuntu
    container_name: spark_master
    hostname: spark-master
    restart: unless-stopped
    init: true
    command: 
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host 
      - spark-master
      - --port 
      - "7077"
      - --webui-port 
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    cpus: 1
    mem_limit: 1g
    volumes:
      - ./docker_mount/spark_standalone/spark_master/logs:/opt/spark/logs
    networks:
      - spark-net
      - kafka-net
      - clickhouse-net
  
  spark-worker-1:
    image: spark:4.2.0-scala2.13-java21-python3-ubuntu
    container_name: spark_worker_1
    hostname: spark-worker-1
    restart: unless-stopped
    init: true
    depends_on:
      - spark_master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host 
      - spark-worker-1
      - --cores
      - "2"
      - --memory
      - "3g"
      - --webui-port 
      - "8081"
      - --work-dir
      - /opt/spark/work
      - spark://spark-master:7077
    ports:
      - "8081:8081"
    cpus: 2
    mem_limit: 3g
    volumes:
      - ./docker_mount/spark_standalone/spark_worker_1/logs:/opt/spark/logs
      - ./docker_mount/spark_standalone/spark_worker_1/work:/opt/spark/work
    networks:
      - spark-net
      - kafka-net
      - clickhouse-net

  spark-worker-2:
    image: spark:4.2.0-scala2.13-java21-python3-ubuntu
    container_name: spark_worker_2
    hostname: spark-worker-2
    restart: unless-stopped
    init: true
    depends_on:
      - spark_master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host 
      - spark-worker-2
      - --cores
      - "2"
      - --memory
      - "3g"
      - --webui-port 
      - "8082"
      - --work-dir
      - /opt/spark/work
      - spark://spark-master:7077
    ports:
      - "8082:8082"
    cpus: 2
    mem_limit: 3g
    volumes:
      - ./docker_mount/spark_standalone/spark_worker_2/logs:/opt/spark/logs
      - ./docker_mount/spark_standalone/spark_worker_2/work:/opt/spark/work
    networks:
      - spark-net
      - kafka-net
      - clickhouse-net
  
  spark-history:
    image: spark:4.2.0-scala2.13-java21-python3-ubuntu
    container_name: spark_history
    hostname: spark-history
    restart: unless-stopped
    init: true
    depends_on:
      - spark_master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    ports:
      - "18080:18080"
    cpus: 1
    mem_limit: 1g
    volumes:
      - ./docker_mount/spark_standalone/spark_history/logs:/opt/spark/logs
      - ./docker_mount/spark_standalone/conf/history-spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./docker_mount/spark_standalone/spark_history/events:/opt/spark/events:ro
      - ./docker_mount/spark_standalone/spark_history/store:/opt/spark/store/path
    networks:
      - spark-net
    
  clickhouse-server:
    image: clickhouse/clickhouse-server:head-distroless
    container_name: clickhouse_server
    hostname: clickhouse-server
    restart: unless-stopped
    ports:
      - "8123:8123"  
      - "9000:9000"
    cpus: 1
    mem_limit: 2g
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_admin_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Asia/Ho_Chi_Minh
    secrets:
      - clickhouse_admin_username
      - clickhouse_admin_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./docker_mount/clickhouse/data:/var/lib/clickhouse
      - ./docker_mount/clickhouse/logs:/var/log/clickhouse-server
    healthcheck:
      test:
        - CMD
        - >-
          clickhouse-client
          --user=clickhouse
          --password=/run/secrets/clickhouse_admin_password
          --query='SELECT 1'      
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  postgresql-net:
    name: postgresql-net
    driver: bridge
  kafka-net:
    name: kafka-net
    driver: bridge
  spark-net:
    name: spark-net
    driver: bridge
  clickhouse-net:
    name: clickhouse-net
    driver: bridge

secrets:
  postgresql_admin_username:
    file: ./docker_secrets/postgresql_admin_username.txt
  postgresql_admin_password:
    file: ./docker_secrets/postgresql_admin_password.txt
  clickhouse_admin_username:
    file: ./docker_secrets/clickhouse_admin_username.txt
  clickhouse_admin_password:
    file: ./docker_secrets/clickhouse_admin_password.txt